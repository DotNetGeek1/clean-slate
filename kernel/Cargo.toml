[package]
name = "clean-slate-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# #162: fail closed when a syscall returns with its task stack >75% used; logs
# exec and boot stack peaks. Debug/self-test only (scans stack on every syscall).
stack-high-water-check = []
gdb-entry = []
m1-self-test = []
m2-double-fault-self-test = []
m2-self-test = []
m2-timer-self-test = []
m3-address-space-self-test = []
m3-entry-self-test = []
m3-resources-self-test = []
m3-syscall-self-test = ["m3-entry-self-test"]
m3-ipc-self-test = ["m3-entry-self-test"]
m8-linux-dispatch-self-test = ["m3-entry-self-test"]
m9-syscall-fail-closed-self-test = ["m3-entry-self-test", "stack-high-water-check"]
m9-block-wake-self-test = ["m3-entry-self-test", "stack-high-water-check"]
m9-stack-guard-self-test = ["stack-high-water-check"]
m9-fd-core-self-test = ["m3-entry-self-test", "stack-high-water-check"]
m10-port-self-test = ["m3-entry-self-test", "stack-high-water-check"]
m4-crash-service-self-test = []
m4-service-lifecycle-self-test = ["m3-entry-self-test"]
m4-supervisor-self-test = ["m3-entry-self-test"]
m4-recovery-self-test = []
m5-block-self-test = []
# #111: boot-context GOP framebuffer lane (kernel-internal present + aperture readback).
m10-framebuffer-self-test = []
m7-tls-self-test = [
    "clean-slate-network/tls",
    "clean-slate-network/m7-handshake-trace",
    "dep:rand_core",
]
m7-tls-fail-closed-self-test = ["m7-tls-self-test"]
m5-storage-self-test = ["m3-entry-self-test", "dep:clean-slate-store"]
m5-persistence-self-test = ["m3-entry-self-test", "dep:clean-slate-store"]
m5-crash-early-self-test = ["m3-entry-self-test", "dep:clean-slate-store"]
m5-crash-late-self-test = ["m3-entry-self-test", "dep:clean-slate-store"]
m5-crash-recovery-self-test = ["m3-entry-self-test", "dep:clean-slate-store"]
m6-object-self-test = ["m3-entry-self-test", "dep:clean-slate-store"]
m6-process-control-self-test = ["m3-entry-self-test"]
m6-delegation-self-test = ["m3-entry-self-test"]
m6-revocation-self-test = ["m3-entry-self-test"]
m6-audit-self-test = ["m3-entry-self-test"]
m6-capabilities-self-test = ["m3-entry-self-test", "dep:clean-slate-store"]
m6-fixture-smoke-self-test = ["m3-entry-self-test"]
m7-net-service-self-test = ["m3-entry-self-test"]
m7-network-self-test = ["m7-net-service-self-test"]
m7-net-caps-self-test = ["m3-entry-self-test"]
m7-dns-self-test = ["m3-entry-self-test"]
m7-net-device-self-test = ["m3-entry-self-test"]
# M10 #196: modern-only virtio-blk (and virtio-gpu) transport probe in boot context.
m10-virtio-modern-self-test = ["m3-entry-self-test", "m10-timeout-introspection"]
# W3 registry introspection (`sched::timeout::armed_count`) for self-test lanes.
m10-timeout-introspection = []
# M8.2 (#92): embeds the frozen Linux fixture bytes (`LINUX_M8_FIXTURE`).
# Production builds without it carry no fixture bytes; the loader logic itself
# is always compiled.
m8-linux-image = []
m8-linux-image-self-test = ["m8-linux-image", "m3-entry-self-test"]
# M8.7 (#97): production Linux hello boot path (embeds fixture via m8-linux-image).
m8-linux-hello = ["m8-linux-image"]
m8-linux-hello-self-test = ["m8-linux-hello", "m3-entry-self-test"]
m9-low-va-self-test = ["m8-linux-image", "m3-entry-self-test", "stack-high-water-check"]
m9-linux-exec-self-test = ["m8-linux-image", "m3-entry-self-test", "stack-high-water-check"]
m9-linux-runtime-self-test = ["m8-linux-image", "m3-entry-self-test", "stack-high-water-check"]
m9-linux-socket = []
m9-linux-socket-self-test = [
    "m9-linux-socket",
    "m8-linux-image",
    "m3-entry-self-test",
    "m7-network-self-test",
    "stack-high-water-check",
]
m9-linux-proc-self-test = ["m8-linux-image", "m3-entry-self-test", "stack-high-water-check"]
m9-rootfs = ["dep:clean-slate-rootfs"]
m9-rootfs-self-test = ["m9-rootfs", "m3-entry-self-test", "stack-high-water-check"]
m9-linux-fs-self-test = [
    "m9-rootfs",
    "m3-entry-self-test",
    "m6-object-self-test",
    "dep:clean-slate-store",
    "stack-high-water-check",
]
m9-userspace-self-test = [
    "m9-rootfs",
    "m9-linux-socket",
    "m8-linux-image",
    "m3-entry-self-test",
    "m7-network-self-test",
    "m6-object-self-test",
    "dep:clean-slate-store",
    "stack-high-water-check",
]
m9-linux-trace = []
m9-linux-trace-self-test = [
    "m9-linux-trace",
    "m8-linux-image",
    "m3-entry-self-test",
    "stack-high-water-check",
]
# M10 #195 S0: CPL3 fetch from an RW+NX page faults 0x15 (EFER.NXE enforced).
m10-nxe-self-test = ["m3-entry-self-test", "stack-high-water-check"]
# M10 #195 S2: scripted fixture lane for bounded shared user buffers (phase `nx`).
m10-shared-buffer-self-test = ["m3-entry-self-test", "stack-high-water-check"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "clean-slate-kernel"
path = "src/main.rs"
test = false

[dependencies]
clean-slate-block = { path = "../block" }
clean-slate-elf = { path = "../elf" }
clean-slate-network = { path = "../network" }
rand_core = { version = "=0.6.4", default-features = false, optional = true }
clean-slate-capability = { path = "../capability" }
clean-slate-graphics = { path = "../graphics" }
clean-slate-linux-abi = { path = "../linux-abi" }
clean-slate-native-abi = { path = "../native-abi" }
clean-slate-port = { path = "../port" }
clean-slate-raster = { path = "../raster" }
clean-slate-rootfs = { path = "../rootfs", optional = true }
clean-slate-service-fixtures = { path = "../service-fixtures" }
clean-slate-service-lifecycle = { path = "../service-lifecycle" }
clean-slate-store = { path = "../store", optional = true }
uefi = "0.37.0"
uefi-raw = "0.14.0"
x86_64 = { version = "0.15.5", default-features = false, features = ["instructions"] }

[dev-dependencies]
clean-slate-graphics = { path = "../graphics", features = ["fake"] }

[build-dependencies]
clean-slate-elf = { path = "../elf" }
clean-slate-rootfs = { path = "../rootfs", features = ["std"] }

[lints]
workspace = true
