[package]
name = "clean-slate-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
gdb-entry = []
m1-self-test = []
m2-double-fault-self-test = []
m2-self-test = []
m2-timer-self-test = []
m3-address-space-self-test = []
m3-entry-self-test = []
m3-resources-self-test = []
m3-syscall-self-test = ["m3-entry-self-test"]
m3-ipc-self-test = ["m3-entry-self-test"]
m4-crash-service-self-test = []
m4-service-lifecycle-self-test = ["m3-entry-self-test"]
m4-supervisor-self-test = ["m3-entry-self-test"]
m4-recovery-self-test = []
m5-block-self-test = []
m7-tls-self-test = [
    "clean-slate-network/tls",
    "clean-slate-network/m7-handshake-trace",
    "dep:rand_core",
]
m7-tls-fail-closed-self-test = ["m7-tls-self-test"]
m5-storage-self-test = ["m3-entry-self-test", "dep:clean-slate-store"]
m5-persistence-self-test = ["m3-entry-self-test", "dep:clean-slate-store"]
m5-crash-early-self-test = ["m3-entry-self-test", "dep:clean-slate-store"]
m5-crash-late-self-test = ["m3-entry-self-test", "dep:clean-slate-store"]
m5-crash-recovery-self-test = ["m3-entry-self-test", "dep:clean-slate-store"]
m6-object-self-test = ["m3-entry-self-test", "dep:clean-slate-store"]
m6-process-control-self-test = ["m3-entry-self-test"]
m6-delegation-self-test = ["m3-entry-self-test"]
m6-revocation-self-test = ["m3-entry-self-test"]
m6-audit-self-test = ["m3-entry-self-test"]
m6-capabilities-self-test = ["m3-entry-self-test", "dep:clean-slate-store"]
m6-fixture-smoke-self-test = ["m3-entry-self-test"]
m7-net-service-self-test = ["m3-entry-self-test"]
m7-network-self-test = ["m7-net-service-self-test"]
m7-net-caps-self-test = ["m3-entry-self-test"]
m7-dns-self-test = ["m3-entry-self-test"]
m7-net-device-self-test = ["m3-entry-self-test"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "clean-slate-kernel"
path = "src/main.rs"
test = false

[dependencies]
clean-slate-block = { path = "../block" }
clean-slate-network = { path = "../network" }
rand_core = { version = "=0.6.4", default-features = false, optional = true }
clean-slate-capability = { path = "../capability" }
clean-slate-service-fixtures = { path = "../service-fixtures" }
clean-slate-service-lifecycle = { path = "../service-lifecycle" }
clean-slate-store = { path = "../store", optional = true }
uefi = "0.37.0"
x86_64 = { version = "0.15.5", default-features = false, features = ["instructions"] }

[lints]
workspace = true
