[package]
name = "clean-slate-service-fixtures"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "M4.7 deterministic supervised crash/fault-injection service fixtures"

[lib]
path = "src/lib.rs"

[dependencies]
clean-slate-block = { path = "../block" }
clean-slate-capability = { path = "../capability" }
clean-slate-graphics = { path = "../graphics" }
clean-slate-native-abi = { path = "../native-abi" }
clean-slate-network = { path = "../network" }
clean-slate-service-lifecycle = { path = "../service-lifecycle" }

[dev-dependencies]
clean-slate-block = { path = "../block", features = ["alloc"] }
# `net_probe` tests check its constants against the fixture peer. Dev-only: no build of
# the library, and so no production image, gets `network::fixture` from it.
clean-slate-network = { path = "../network", features = ["alloc", "fixture"] }

[lints]
workspace = true
