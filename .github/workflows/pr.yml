name: PR validation

on:
  pull_request:
    paths:
      - "block/**"
      - "kernel/**"
      - "store/**"
      - "xtask/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/**"
  push:
    branches:
      - main
    paths:
      - "block/**"
      - "kernel/**"
      - "store/**"
      - "xtask/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt, rust-src
          targets: x86_64-unknown-uefi

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (xtask)
        run: cargo clippy -p xtask --all-targets -- -D warnings

      - name: Clippy (block contract)
        run: cargo clippy -p clean-slate-block --all-targets --features alloc -- -D warnings

      - name: Clippy (store)
        run: cargo clippy -p clean-slate-store --all-targets -- -D warnings

      - name: Clippy (kernel UEFI)
        run: cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi -- -D warnings

      - name: Clippy (kernel host tests)
        run: cargo clippy -p clean-slate-kernel --lib --tests -- -D warnings

      - name: Build
        run: |
          cargo build -p xtask
          cargo build -p clean-slate-block --features alloc
          cargo build -p clean-slate-store
          cargo build -p clean-slate-kernel --target x86_64-unknown-uefi
          cargo xtask build

      - name: Host unit tests
        run: |
          cargo test -p xtask
          cargo test -p clean-slate-block
          cargo test -p clean-slate-block --features alloc
          cargo test -p clean-slate-store
          cargo test -p clean-slate-kernel
          cargo test -p clean-slate-kernel --features m3-entry-self-test
          cargo test -p clean-slate-kernel --features m3-address-space-self-test
          cargo test -p clean-slate-kernel --features m3-syscall-self-test

  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rust-src
          targets: x86_64-unknown-uefi

      - uses: Swatinem/rust-cache@v2

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Exhaustive QEMU acceptance
        run: bash ./scripts/run-tests.sh --exhaustive

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xtask-test-report
          path: target/xtask-test-report.txt
          if-no-files-found: ignore
