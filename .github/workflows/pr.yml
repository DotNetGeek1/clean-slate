name: PR validation

on:
  pull_request:
    paths:
      - "block/**"
      - "capability/**"
      - "compositor/**"
      - "desktop-shell/**"
      - "elf/**"
      - "graphics/**"
      - "kernel/**"
      - "linux-abi/**"
      - "native-abi/**"
      - "net-service/**"
      - "network/**"
      - "playground/**"
      - "terminal/**"
      - "console/**"
      - "port/**"
      - "runtime/**"
      - "raster/**"
      - "rootfs/**"
      - "service-fixtures/**"
      - "service-lifecycle/**"
      - "store/**"
      - "supervisor/**"
      - "ui/**"
      - "fixtures/**"
      - "xtask/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/**"
  push:
    branches:
      - main
    paths:
      - "block/**"
      - "capability/**"
      - "compositor/**"
      - "desktop-shell/**"
      - "elf/**"
      - "graphics/**"
      - "kernel/**"
      - "linux-abi/**"
      - "native-abi/**"
      - "net-service/**"
      - "network/**"
      - "playground/**"
      - "terminal/**"
      - "console/**"
      - "port/**"
      - "runtime/**"
      - "raster/**"
      - "rootfs/**"
      - "service-fixtures/**"
      - "service-lifecycle/**"
      - "store/**"
      - "supervisor/**"
      - "ui/**"
      - "fixtures/**"
      - "xtask/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Workspace path filters and crate coverage
        run: python3 scripts/check-workflow-paths.py

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt, rust-src
          targets: x86_64-unknown-uefi

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (xtask)
        run: cargo clippy -p xtask --all-targets -- -D warnings

      - name: Clippy (block contract)
        run: cargo clippy -p clean-slate-block --all-targets --features alloc -- -D warnings

      - name: Clippy (network contract)
        run: |
          cargo clippy -p clean-slate-network --all-targets -- -D warnings
          cargo clippy -p clean-slate-network --all-targets --features alloc -- -D warnings
          cargo clippy -p clean-slate-network --all-targets --features alloc,tls -- -D warnings

      - name: Clippy (raster)
        run: cargo clippy -p clean-slate-raster --all-targets -- -D warnings

      - name: Clippy (ui)
        run: |
          cargo clippy -p clean-slate-ui --all-targets -- -D warnings
          cargo clippy -p clean-slate-ui --target x86_64-unknown-uefi -- -D warnings

      - name: Clippy (capability)
        run: cargo clippy -p clean-slate-capability --all-targets -- -D warnings

      # scripts/check-workflow-paths.py fails when a workspace member has no clippy or test line.
      - name: Clippy (native-abi)
        run: cargo clippy -p clean-slate-native-abi --all-targets -- -D warnings

      - name: Clippy (graphics)
        run: |
          cargo clippy -p clean-slate-graphics --all-targets -- -D warnings
          cargo clippy -p clean-slate-graphics --all-targets --features fake -- -D warnings

      - name: Clippy (port)
        run: |
          cargo clippy -p clean-slate-port --all-targets -- -D warnings
          cargo clippy -p clean-slate-port --all-targets --features fake -- -D warnings
          cargo clippy -p clean-slate-runtime --all-targets -- -D warnings
          cargo clippy -p clean-slate-runtime --all-targets --features fake -- -D warnings

      - name: Clippy (compositor)
        run: |
          cargo clippy -p clean-slate-compositor --all-targets -- -D warnings
          cargo clippy -p clean-slate-compositor --all-targets --features fake -- -D warnings

      - name: Clippy (playground)
        run: cargo clippy -p clean-slate-playground --all-targets -- -D warnings

      - name: Clippy (terminal)
        run: cargo clippy -p clean-slate-terminal --all-targets -- -D warnings

      - name: Clippy (console)
        run: cargo clippy -p clean-slate-console --all-targets -- -D warnings

      - name: Clippy (desktop-shell)
        run: cargo clippy -p clean-slate-desktop-shell --all-targets -- -D warnings

      - name: Clippy (linux-abi)
        run: cargo clippy -p clean-slate-linux-abi --all-targets -- -D warnings

      - name: Clippy (elf)
        run: cargo clippy -p clean-slate-elf --all-targets -- -D warnings

      - name: Clippy (store)
        run: cargo clippy -p clean-slate-store --all-targets -- -D warnings

      - name: Clippy (service libraries)
        run: |
          cargo clippy -p clean-slate-service-fixtures --all-targets -- -D warnings
          cargo clippy -p clean-slate-service-lifecycle --all-targets -- -D warnings
          cargo clippy -p clean-slate-supervisor --all-targets -- -D warnings
          cargo clippy -p clean-slate-rootfs --all-targets -- -D warnings

      # Same target, features and build-std set as the xtask builds that embed these ELFs.
      - name: Clippy (userspace binaries)
        env:
          RUSTC_BOOTSTRAP: "1"
        run: |
          for bin in clean-slate-supervisor-userspace clean-slate-supervisor-restart-policy-userspace clean-slate-supervisor-recovery-userspace clean-slate-m6-fixture-userspace clean-slate-supervisor-init clean-slate-audit-userspace; do
            cargo clippy -p clean-slate-supervisor --bin "$bin" --features userspace --target x86_64-unknown-none -Z build-std=core,compiler_builtins --release -- -D warnings
          done
          for bin in clean-slate-compositor-userspace clean-slate-compositor-client-userspace; do
            cargo clippy -p clean-slate-compositor --bin "$bin" --features userspace --target x86_64-unknown-none -Z build-std=core,compiler_builtins --release -- -D warnings
          done
          cargo clippy -p clean-slate-playground --bin clean-slate-playground-userspace --features userspace --target x86_64-unknown-none -Z build-std=core,compiler_builtins --release -- -D warnings
          cargo clippy -p clean-slate-terminal --bin clean-slate-terminal-userspace --features userspace --target x86_64-unknown-none -Z build-std=core,compiler_builtins --release -- -D warnings
          cargo clippy -p clean-slate-console --bin clean-slate-console-userspace --features userspace --target x86_64-unknown-none -Z build-std=core,compiler_builtins --release -- -D warnings
          cargo clippy -p clean-slate-desktop-shell --bin clean-slate-desktop-shell-userspace --features userspace --target x86_64-unknown-none -Z build-std=core,compiler_builtins --release -- -D warnings
          cargo clippy -p clean-slate-store --bin clean-slate-storage-userspace --features userspace --target x86_64-unknown-none -Z build-std=core,alloc,compiler_builtins --release -- -D warnings
          cargo clippy -p clean-slate-net-service --bin clean-slate-network-userspace --features userspace --target x86_64-unknown-none -Z build-std=core,alloc,compiler_builtins --release -- -D warnings

      # The default image (and the system-test-hooks build) embeds these four ELFs for init's
      # desktop rows (kernel/build.rs).
      - name: Build M10 desktop userspace images
        env:
          RUSTC_BOOTSTRAP: "1"
        run: |
          cargo build -p clean-slate-compositor --bin clean-slate-compositor-userspace --features userspace --target x86_64-unknown-none -Z build-std=core,compiler_builtins --release
          cargo build -p clean-slate-desktop-shell --bin clean-slate-desktop-shell-userspace --features userspace --target x86_64-unknown-none -Z build-std=core,compiler_builtins --release
          cargo build -p clean-slate-playground --bin clean-slate-playground-userspace --features userspace --target x86_64-unknown-none -Z build-std=core,compiler_builtins --release
          cargo build -p clean-slate-terminal --bin clean-slate-terminal-userspace --features userspace --target x86_64-unknown-none -Z build-std=core,compiler_builtins --release

      # Every kernel build embeds the storage and network ELFs (kernel/build.rs), including
      # clippy, the bare kernel build, and host tests below; the featureless build (the default
      # image, also the host tests) embeds init, the audit service and the console service as well. The M4 supervisor
      # and recovery self-tests embed their supervisor ELFs, and the M6 fixture self-tests (with
      # m7-net-caps, m9-linux-fs, m9-userspace, m10-port and m10-shared-buffer) the M6 fixture.
      - name: Build embedded userspace images
        env:
          RUSTC_BOOTSTRAP: "1"
        run: |
          cargo build -p clean-slate-store --bin clean-slate-storage-userspace --features userspace --target x86_64-unknown-none -Z build-std=core,alloc,compiler_builtins --release
          cargo build -p clean-slate-net-service --bin clean-slate-network-userspace --features userspace --target x86_64-unknown-none -Z build-std=core,alloc,compiler_builtins --release
          for bin in clean-slate-supervisor-init clean-slate-audit-userspace clean-slate-supervisor-userspace clean-slate-supervisor-recovery-userspace clean-slate-m6-fixture-userspace; do
            cargo build -p clean-slate-supervisor --bin "$bin" --features userspace --target x86_64-unknown-none -Z build-std=core,compiler_builtins --release
          done
          cargo build -p clean-slate-console --bin clean-slate-console-userspace --features userspace --target x86_64-unknown-none -Z build-std=core,compiler_builtins --release

      # Every kernel feature set xtask builds needs a line here: `cargo test -p xtask` fails
      # (ci_coverage) when one is missing.
      - name: Clippy (kernel UEFI)
        run: |
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features gdb-entry -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m1-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m2-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m2-timer-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m2-double-fault-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m2-identity-guard-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m2-kernel-guards-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m3-entry-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m3-address-space-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m3-syscall-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m3-ipc-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m3-resources-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m4-service-lifecycle-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m4-supervisor-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m4-crash-service-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m4-recovery-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m5-block-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m5-storage-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m5-persistence-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m5-object-churn-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m5-crash-early-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m5-crash-late-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m5-crash-torn-superblock-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m5-crash-torn-payload-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m5-crash-recovery-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m6-fixture-smoke-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m6-object-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m6-process-control-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m6-delegation-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m6-revocation-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m6-audit-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m6-capabilities-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m7-net-device-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m7-net-service-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m7-network-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m7-net-caps-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m7-dns-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m7-tls-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m7-tls-fail-closed-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m8-linux-image -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m8-linux-image-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m8-linux-hello -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m8-linux-hello-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m8-linux-dispatch-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m9-syscall-fail-closed-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m9-block-wake-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m9-stack-guard-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m9-fd-core-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m9-linux-trace -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m9-linux-trace-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m9-linux-socket -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m9-linux-socket-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m9-linux-fs-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m9-userspace-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m9-low-va-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m9-linux-exec-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m9-linux-runtime-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m9-linux-proc-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m9-rootfs -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m9-rootfs-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m10-nxe-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m10-shared-buffer-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m10-port-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m10-native-memory-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m10-clock-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m10-virtio-modern-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m10-virtio-gpu-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m10-framebuffer-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m10-input-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features serial-input-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features system-test-hooks -- -D warnings

      - name: Clippy (kernel host tests)
        run: |
          cargo clippy -p clean-slate-kernel --lib --tests -- -D warnings
          cargo clippy -p clean-slate-kernel --lib --tests --features m4-service-lifecycle-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --lib --tests --features m4-recovery-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --lib --tests --features m9-rootfs,m9-linux-socket,m9-linux-trace -- -D warnings
          cargo clippy -p clean-slate-kernel --lib --tests --features system-test-hooks -- -D warnings

      - name: Build
        run: |
          cargo build -p xtask
          cargo build -p clean-slate-block --features alloc
          cargo build -p clean-slate-network
          cargo build -p clean-slate-network --features alloc
          cargo build -p clean-slate-store
          cargo build -p clean-slate-kernel --target x86_64-unknown-uefi
          cargo xtask build

      - name: Verify M8 Linux fixture
        run: cargo xtask verify-m8-fixture

      - name: Host unit tests
        run: |
          cargo test -p xtask
          cargo test -p clean-slate-block
          cargo test -p clean-slate-block --features alloc
          cargo test -p clean-slate-network
          cargo test -p clean-slate-network --features alloc
          cargo test -p clean-slate-network --features alloc,tls
          cargo test -p clean-slate-store
          cargo test -p clean-slate-raster
          cargo test -p clean-slate-ui
          cargo test -p clean-slate-capability
          cargo test -p clean-slate-native-abi
          cargo test -p clean-slate-graphics
          cargo test -p clean-slate-graphics --features fake
          cargo test -p clean-slate-service-fixtures
          cargo test -p clean-slate-service-lifecycle
          cargo test -p clean-slate-supervisor
          cargo test -p clean-slate-net-service
          cargo test -p clean-slate-port
          cargo test -p clean-slate-port --features fake
          cargo test -p clean-slate-runtime
          cargo test -p clean-slate-compositor
          cargo test -p clean-slate-playground
          cargo test -p clean-slate-terminal
          cargo test -p clean-slate-console
          cargo test -p clean-slate-desktop-shell
          cargo test -p clean-slate-linux-abi
          cargo test -p clean-slate-elf
          # verify-m9-fixture, clean-slate-rootfs --features std and the M9-gated kernel
          # host tests run once, as steps of `cargo xtask test-m9` in the acceptance job.
          cargo test -p clean-slate-rootfs
          cargo test -p clean-slate-kernel
          cargo test -p clean-slate-kernel --features m3-entry-self-test
          cargo test -p clean-slate-kernel --features m3-address-space-self-test
          cargo test -p clean-slate-kernel --features m3-syscall-self-test
          cargo test -p clean-slate-kernel --lib --features m4-service-lifecycle-self-test
          cargo test -p clean-slate-kernel --lib --features m4-recovery-self-test
          cargo test -p clean-slate-kernel --features m8-linux-image
          cargo test -p clean-slate-kernel --features m8-linux-hello
          cargo test -p clean-slate-kernel --features system-test-hooks --lib

  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rust-src
          targets: x86_64-unknown-uefi

      - uses: Swatinem/rust-cache@v2

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      # test-m9 and test-m10 run each of their constituents once; --exhaustive does not repeat them.
      - name: Exhaustive QEMU acceptance (M1–M10 aggregates + constituents)
        run: bash ./scripts/run-tests.sh --exhaustive

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xtask-test-report
          path: target/xtask-test-report.txt
          if-no-files-found: ignore

      # QMP lane screendumps (the desktop lane's six captures per backend) and serial logs.
      - name: Upload QEMU lane artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xtask-artifacts
          path: target/xtask-artifacts
          if-no-files-found: ignore
