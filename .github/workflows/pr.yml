name: PR validation

on:
  pull_request:
    paths:
      - "block/**"
      - "capability/**"
      - "kernel/**"
      - "network/**"
      - "store/**"
      - "fixtures/**"
      - "xtask/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/**"
  push:
    branches:
      - main
    paths:
      - "block/**"
      - "capability/**"
      - "kernel/**"
      - "network/**"
      - "store/**"
      - "fixtures/**"
      - "xtask/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt, rust-src
          targets: x86_64-unknown-uefi

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (xtask)
        run: cargo clippy -p xtask --all-targets -- -D warnings

      - name: Clippy (block contract)
        run: cargo clippy -p clean-slate-block --all-targets --features alloc -- -D warnings

      - name: Clippy (network contract)
        run: |
          cargo clippy -p clean-slate-network --all-targets -- -D warnings
          cargo clippy -p clean-slate-network --all-targets --features alloc -- -D warnings
          cargo clippy -p clean-slate-network --all-targets --features alloc,tls -- -D warnings

      - name: Clippy (capability)
        run: cargo clippy -p clean-slate-capability --all-targets -- -D warnings

      - name: Clippy (linux-abi)
        run: cargo clippy -p clean-slate-linux-abi --all-targets -- -D warnings

      - name: Clippy (elf)
        run: cargo clippy -p clean-slate-elf --all-targets -- -D warnings

      - name: Clippy (store)
        run: cargo clippy -p clean-slate-store --all-targets -- -D warnings

      - name: Clippy (kernel UEFI)
        run: |
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m7-tls-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m8-linux-image -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m8-linux-image-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m8-linux-hello -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m8-linux-hello-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m8-linux-dispatch-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m9-syscall-fail-closed-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m9-block-wake-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m9-fd-core-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m9-linux-socket-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m9-low-va-self-test -- -D warnings
          cargo clippy -p clean-slate-kernel --target x86_64-unknown-uefi --features m9-linux-exec-self-test -- -D warnings

      - name: Clippy (kernel host tests)
        run: cargo clippy -p clean-slate-kernel --lib --tests -- -D warnings

      - name: Build
        run: |
          cargo build -p xtask
          cargo build -p clean-slate-block --features alloc
          cargo build -p clean-slate-network
          cargo build -p clean-slate-network --features alloc
          cargo build -p clean-slate-store
          cargo build -p clean-slate-kernel --target x86_64-unknown-uefi
          cargo xtask build

      - name: Verify M8 Linux fixture
        run: cargo xtask verify-m8-fixture

      - name: Host unit tests
        run: |
          cargo test -p xtask
          cargo test -p clean-slate-block
          cargo test -p clean-slate-block --features alloc
          cargo test -p clean-slate-network
          cargo test -p clean-slate-network --features alloc
          cargo test -p clean-slate-network --features alloc,tls
          cargo test -p clean-slate-store
          cargo test -p clean-slate-capability
          cargo test -p clean-slate-linux-abi
          cargo test -p clean-slate-elf
          cargo test -p clean-slate-kernel
          cargo test -p clean-slate-kernel --features m3-entry-self-test
          cargo test -p clean-slate-kernel --features m3-address-space-self-test
          cargo test -p clean-slate-kernel --features m3-syscall-self-test
          cargo test -p clean-slate-kernel --features m8-linux-image
          cargo test -p clean-slate-kernel --features m8-linux-hello

  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rust-src
          targets: x86_64-unknown-uefi

      - uses: Swatinem/rust-cache@v2

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Exhaustive QEMU acceptance (M1–M8 aggregates + constituents)
        run: bash ./scripts/run-tests.sh --exhaustive

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xtask-test-report
          path: target/xtask-test-report.txt
          if-no-files-found: ignore
