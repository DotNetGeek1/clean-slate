[workspace]
members = [ "block",
    "capability",
    "kernel",
    "net-service",
    "network",
    "service-fixtures",
    "service-lifecycle",
    "store",
    "supervisor",
    "xtask",
]
default-members = ["xtask"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
authors = ["Clean-Slate Contributors"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.dev]
panic = "abort"
debug = 2

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"

[profile.release.package.clean-slate-supervisor]
opt-level = "z"
