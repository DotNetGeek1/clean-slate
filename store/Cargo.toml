[package]
name = "clean-slate-store"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "M5 minimal persistent object store with an explicit versioned on-disk format"

[lib]
path = "src/lib.rs"

[features]
userspace = []

[[bin]]
name = "clean-slate-storage-userspace"
path = "src/bin/userspace.rs"
required-features = ["userspace"]

[dependencies]
clean-slate-block = { path = "../block", features = ["alloc"] }
clean-slate-capability = { path = "../capability" }
clean-slate-service-fixtures = { path = "../service-fixtures" }

[lints]
workspace = true
