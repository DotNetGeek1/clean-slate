[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
clean-slate-compositor = { path = "../compositor" }
clean-slate-graphics = { path = "../graphics" }
clean-slate-playground = { path = "../playground" }
clean-slate-terminal = { path = "../terminal" }
clean-slate-desktop-shell = { path = "../desktop-shell" }
clean-slate-raster = { path = "../raster" }
clean-slate-ui = { path = "../ui" }
clean-slate-rootfs = { path = "../rootfs", features = ["std"] }
clean-slate-network = { path = "../network", features = ["fixture"] }
clean-slate-block = { path = "../block", features = ["alloc"] }
clean-slate-store = { path = "../store" }
clean-slate-native-abi = { path = "../native-abi" }
rcgen = { version = "=0.13.2", default-features = false, features = ["pem", "crypto", "ring"] }
rustls = { version = "=0.23.26", default-features = false, features = ["ring", "std", "tls12"] }
time = { version = "=0.3.39", default-features = false, features = ["formatting", "parsing", "macros"] }
smoltcp = { version = "0.12.0", default-features = false, features = [
    "std",
    "medium-ethernet",
    "proto-ipv4",
    "socket-udp",
    "socket-tcp",
    "socket-icmp",
] }

[lints]
workspace = true
