[package]
name = "clean-slate-supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "M4.3 userspace supervisor runtime and bounded service registry"
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "clean-slate-supervisor-userspace"
path = "src/bin/userspace.rs"
required-features = ["userspace"]

[[bin]]
name = "clean-slate-supervisor-restart-policy-userspace"
path = "src/bin/restart_policy_userspace.rs"
required-features = ["userspace"]

[[bin]]
name = "clean-slate-supervisor-recovery-userspace"
path = "src/bin/recovery_userspace.rs"
required-features = ["userspace"]

[features]
default = []
userspace = []

[dependencies]
clean-slate-service-lifecycle = { path = "../service-lifecycle" }

[lints]
workspace = true
