[package]
name = "clean-slate-net-service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "M7 CPL3 network service userspace runtime"

[features]
userspace = []

[[bin]]
name = "clean-slate-network-userspace"
path = "src/bin/userspace.rs"
required-features = ["userspace"]

[dependencies]
clean-slate-capability = { path = "../capability" }
clean-slate-network = { path = "../network", features = ["alloc", "tls"] }
clean-slate-service-fixtures = { path = "../service-fixtures" }
rand_core = { version = "=0.6.4", default-features = false }

[lints]
workspace = true
