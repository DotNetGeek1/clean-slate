[package]
name = "clean-slate-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Native runtime every native program links: syscalls, one error mapping, port, compositor and console clients, and a heap over the native memory call"

[lib]
path = "src/lib.rs"

[features]
default = []
# `fake::FakeKernel`: a host stand-in for the kernel, for clients' host tests.
fake = ["dep:clean-slate-port", "clean-slate-port/fake"]

[dependencies]
clean-slate-capability = { path = "../capability" }
clean-slate-graphics = { path = "../graphics" }
clean-slate-native-abi = { path = "../native-abi" }
clean-slate-port = { path = "../port", optional = true }

[dev-dependencies]
clean-slate-port = { path = "../port", features = ["fake"] }

[lints]
workspace = true
