[package]
name = "clean-slate-network"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared M7 network contract, socket model, and hermetic fixture vocabulary"

[features]
alloc = []
std = []
tls = [
    "dep:embedded-tls",
    "dep:embedded-io",
    "dep:rand_core",
    "dep:sha2",
    "dep:aes",
]
host-tls-peer = ["tls", "std", "dep:rustls"]

[dependencies]
embedded-tls = { version = "=0.19.0", default-features = false, features = ["rustpki"], optional = true }
embedded-io = { version = "=0.7.1", default-features = false, optional = true }
rand_core = { version = "=0.6.4", default-features = false, optional = true }
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft"], optional = true }
aes = { version = "=0.8.4", default-features = false, optional = true }
rustls = { version = "=0.23.26", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[dev-dependencies]
rcgen = { version = "=0.13.2", default-features = false, features = ["pem", "crypto", "ring"] }
rustls = { version = "=0.23.26", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "=2.2.0"
time = { version = "=0.3.39", default-features = false, features = ["formatting", "parsing", "macros"] }

[lints]
workspace = true
