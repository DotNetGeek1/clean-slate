[package]
name = "clean-slate-playground"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "M10 System Playground: native graphical test app over the compositor protocol and shared UI primitives"
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "clean-slate-playground-userspace"
path = "src/bin/playground.rs"
required-features = ["userspace"]

[features]
default = []
userspace = []

[dependencies]
clean-slate-capability = { path = "../capability" }
clean-slate-graphics = { path = "../graphics" }
clean-slate-native-abi = { path = "../native-abi" }
clean-slate-raster = { path = "../raster" }
clean-slate-ui = { path = "../ui" }

[dev-dependencies]
clean-slate-compositor = { path = "../compositor", features = ["fake"] }
clean-slate-graphics = { path = "../graphics", features = ["fake"] }
clean-slate-port = { path = "../port", features = ["fake"] }

[lints]
workspace = true
